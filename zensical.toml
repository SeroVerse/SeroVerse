[project]
site_url = "https://seroverse.github.io/SeroVerse/"
site_name = "SeroVerse"
site_description = "Unified computational ecosystem and zero-copy SoA core for bacterial surface polysaccharide genomics, structural glycomics, and Bayesian sero-epidemiology"
site_author = "Tom Stanton"
copyright = "Copyright &copy; 2026 Tom Stanton — SeroVerse"

repo_url = "https://github.com/SeroVerse/SeroVerse"
repo_name = "SeroVerse/SeroVerse"
edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = [
    { "Home" = "index.md" },
    { "Architecture & Core Engine" = "architecture.md" },
  ] },
  { "API Reference" = [
    { "Overview" = "reference/index.md" },
    { "seroverse.core" = "reference/core.md" },
    { "seroverse.client" = "reference/client.md" },
  ] },
  { "Community" = [
    "citation.md",
    "conduct.md",
    "contributing.md",
    "releases.md",
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/favicon.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/orbit"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "cyan"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "cyan"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SeroVerse"
name = "SeroVerse on GitHub"

[project.extra.status]
new = "Recently added"
deprecated = "Deprecated"

[project.plugins.search]
enabled = true

[project.plugins.tags]
enabled = true

[project.plugins.autorefs]
enabled = true

[project.plugins.gh-admonitions]
enabled = true

[project.plugins.glightbox]
enabled = true

[project.plugins.llmstxt]
enabled = true
markdown_description = "SeroVerse: Unified computational ecosystem for bacterial surface polysaccharide genomics (SeroRef), structural glycomics (KBank), geno-glycomic biosynthesis (SeroGen), and Bayesian sero-epidemiology (SeroEpi), powered by the seroverse.core Structure-of-Arrays (SoA) engine and seroverse.client rate-limited API clients."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Overview & Architecture" = [
  { "index.md" = "SeroVerse Ecosystem Home, Four Pillars, End-to-End Architecture, Unified Quickstart, and Installation" },
  { "architecture.md" = "seroverse.core Structure-of-Arrays (SoA) containers, sequence/k-mer/alignment/clustering engines, CSR graphs & Relational MPNNs, and seroverse.client rate-limited repository clients" },
]
"API Reference" = [
  { "reference/index.md" = "Overview of seroverse.core and seroverse.client modules" },
  { "reference/core.md" = "seroverse.core: BatchedContainer, RaggedArrayContainer, Intervals, GenomeAssembly, Sequences, RandstrobeIndex, PairwiseAligner, Clusterer, GraphModel, GraphAligner, RelationalMPNN, and LayoutEngine" },
  { "reference/client.md" = "seroverse.client: Client, NCBIClient, ENAClient, BacDiveClient, StrainInfoClient, PathogenwatchBaseClient, and msgpack cassette utilities" },
]
"Community" = [
  { "citation.md" = "How to cite the SeroVerse ecosystem in academic publications" },
  { "conduct.md" = "Contributor Covenant Code of Conduct" },
  { "contributing.md" = "Local development setup, testing, and pull request guidelines" },
  { "releases.md" = "Version history and changelog across SeroVerse packages" },
]

[project.plugins.mkdocstrings]
enabled = true
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
group_by_category = true
summary = true
inherited_members = false
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = { base_path = ["."] }
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
